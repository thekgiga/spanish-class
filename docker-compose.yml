# Production / staging compose stack.
# Bring up with: docker compose --env-file ./.env up -d
# .env at the same level provides DOMAIN, ACME_EMAIL, MYSQL_*, REDIS_* etc.

services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}     # e.g. spanishclass.com  (or :80 for local)
      ACME_EMAIL:   ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    mem_limit: 96m

  frontend:
    image: ${FRONTEND_IMAGE:-spanish-class-frontend:local}
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_URL:  ${VITE_API_URL:-/api}
        VITE_SITE_URL: ${VITE_SITE_URL}
    restart: unless-stopped
    # No port exposure — Caddy reads the volume directly.
    volumes:
      - frontend_dist:/usr/share/app
    mem_limit: 64m

  backend:
    image: ${BACKEND_IMAGE:-spanish-class-backend:local}
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    environment:
      ENV: ${APP_ENV}                                # local / staging / prod
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379
    volumes:
      # Mount the env-specific config the backend's env.ts loader expects
      - ./config/${APP_ENV}/.env:/app/config/${APP_ENV}/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 4s
      retries: 4
      start_period: 30s

  worker:
    image: ${BACKEND_IMAGE:-spanish-class-backend:local}
    command: ["worker"]
    restart: unless-stopped
    environment:
      ENV: ${APP_ENV}
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./config/${APP_ENV}/.env:/app/config/${APP_ENV}/.env:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m
    # Override the image's default HTTP healthcheck — worker doesn't listen on
    # a port. Just confirm node process is alive.
    healthcheck:
      test: ["CMD","sh","-c","pgrep -f 'dist/jobs/worker.js' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=128M
      - --max-connections=50
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-log-bin                       # save disk; backups are mysqldump-based
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 1500m
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","127.0.0.1","-u","root","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 30s
    # NOTE: not exposing 3306 to the host in prod. For DB GUIs, SSH-tunnel.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ persists job state in Redis — eviction would drop jobs silently.
    # `noeviction` returns OOM errors on write instead, which surfaces problems
    # loudly and lets us scale RAM before they cause data loss.
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
  frontend_dist:
