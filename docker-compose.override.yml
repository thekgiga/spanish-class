# Local development overrides.
# Activated automatically by `docker compose up` when this file is present.
# To skip and run prod-like locally: `docker compose -f docker-compose.yml up`.

services:

  caddy:
    # Local HTTP only; let Vite-served apps work without TLS pain.
    environment:
      SITE_ADDRESS: ":80"
    # No 443 mapping; just 80
    ports:
      - "80:80"

  backend:
    environment:
      ENV: local
      NODE_ENV: development
    volumes:
      # Mount source for fast iteration (requires rebuild for type changes)
      - ./config/local/.env:/app/config/local/.env:ro

  mysql:
    # Expose locally for Prisma Studio / DBeaver
    ports:
      - "3306:3306"

  redis:
    ports:
      - "6379:6379"

  # Local worker mounts the same env file as backend (it reads ENV=local
  # and resolves config/local/.env via the env.ts loader).
  worker:
    environment:
      ENV: local
      NODE_ENV: development
    volumes:
      - ./config/local/.env:/app/config/local/.env:ro

